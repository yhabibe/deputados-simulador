<div class="wrap">
  <h1>Teste do motor do simulador</h1>
  <p class="sub">O motor JavaScript de <code>simulador.html</code> contra o motor Python
    (<code>exporta_simulador.py</code>): em cada cenário, as duas implementações precisam eleger exatamente as
    mesmas pessoas nas 27 UFs e barrar as mesmas listas na cláusula de barreira.</p>
  <div class="card"><h2 id="resumo"></h2><div class="scroll" id="tab"></div></div>
</div>
<script>// Motor de distribuição de cadeiras do simulador — porte linha a linha de
// alocacao.distribuir (regra "stf2024") e de exporta_simulador.federar.
// Qualquer mudança aqui precisa continuar passando em teste_simulador.html.

// Candidato: {i (índice na UF), nome, partido, lista, votos, nasc, eleito}
// Agremiação: {id, votos, cands}

function quociente(vv, vagas) {
  const q = Math.floor(vv / vagas), r = vv - q * vagas;
  return 2 * r > vagas ? q + 1 : q;  // fração <= 0,5 desprezada
}

// mais votos; empate → mais idoso (nascimento menor). Array.sort é estável, como sorted().
const ordemCand = (a, b) => b.votos - a.votos || a.nasc - b.nasc;

function distribuir(agrs, vagas, vv) {
  const qe = quociente(vv, vagas);
  const fila = agrs.map(a => [...a.cands].sort(ordemCand));
  const pos = agrs.map(() => 0), cad = agrs.map(() => 0), eleitos = [];
  const proximo = k => { const c = fila[k][pos[k]]; return c && c.votos > 0 ? c : null; };
  const eleger = (k, fase) => { const c = fila[k][pos[k]++]; cad[k]++; eleitos.push({k, c, fase}); };

  // art. 111 – nenhuma agremiação atinge o QE
  if (!agrs.some(a => a.votos >= qe)) {
    const todos = agrs.flatMap((a, k) => a.cands.map(c => ({k, c})))
      .sort((x, y) => ordemCand(x.c, y.c));
    for (const {k, c} of todos.slice(0, vagas)) { cad[k]++; eleitos.push({k, c, fase: "art111"}); }
    return {qe, eleitos, cad};
  }

  // 1ª fase – quociente partidário, candidatos com >= 10% do QE
  agrs.forEach((a, k) => {
    const qp = Math.floor(a.votos / qe);
    while (cad[k] < qp && proximo(k) && proximo(k).votos * 10 >= qe) eleger(k, "QP");
  });

  // maiores médias; empate → mais votos; empate total → primeira na ordem (como max())
  const rodada = (elegivel, fase) => {
    while (eleitos.length < vagas) {
      let melhor = -1, media = 0;
      agrs.forEach((a, k) => {
        if (!elegivel(k)) return;
        const m = a.votos / (cad[k] + 1);
        if (melhor < 0 || m > media || (m === media && a.votos > agrs[melhor].votos)) {
          melhor = k; media = m;
        }
      });
      if (melhor < 0) return;
      eleger(melhor, fase);
    }
  };
  // 2ª fase – agremiações com >= 80% do QE e candidato com >= 20% do QE
  rodada(k => agrs[k].votos * 5 >= 4 * qe && proximo(k) !== null && proximo(k).votos * 5 >= qe, "media");
  // 3ª fase – todas (STF, ADIs 7228/7263/7325)
  rodada(k => proximo(k) !== null, "media3");
  return {qe, eleitos, cad};
}

// round() do Python: meio arredonda para o par
function arredonda(x) {
  const f = Math.floor(x), d = x - f;
  return d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1);
}

// grupos: [[id da lista, ...], ...]. Mesma semântica de exporta_simulador.federar.
function federar(agrs, grupos, fator = 1, limite = null) {
  grupos = grupos.filter(g => g.length > 1);
  const membro = new Map();
  grupos.forEach((g, i) => g.forEach(id => membro.set(id, i)));
  const resto = agrs.filter(a => !membro.has(a.id)), fundidas = [];
  let perdidos = 0;
  grupos.forEach((g, i) => {
    const alvo = agrs.filter(a => membro.get(a.id) === i);
    if (!alvo.length) return;
    let votos = alvo.reduce((s, a) => s + a.votos, 0);
    let cands = alvo.flatMap(a => a.cands);
    if (limite !== null && cands.length > limite) {
      cands = [...cands].sort((a, b) => b.votos - a.votos);
      const cortados = cands.slice(limite).reduce((s, c) => s + c.votos, 0);
      perdidos += cortados; cands = cands.slice(0, limite); votos -= cortados;
    }
    if (fator < 1) {
      const novos = cands.map(c => ({...c, votos: arredonda(c.votos * fator)}));
      const legenda = votos - cands.reduce((s, c) => s + c.votos, 0);
      const novoTotal = novos.reduce((s, c) => s + c.votos, 0) + arredonda(legenda * fator);
      perdidos += votos - novoTotal; votos = novoTotal; cands = novos;
    }
    fundidas.push({id: g.join(" + "), votos, cands, membros: g});
  });
  return {agrs: resto.concat(fundidas), perdidos};
}

// Ano exportado por exporta_simulador.py → {UF: {vagas, vv, agrs}} com objetos prontos
function preparaAno(D) {
  const out = {};
  for (const u of D.ufs) {
    const porLista = new Map(u.listas.map(([l, v]) => [l, {id: D.listas[l].id, votos: v, cands: []}]));
    u.cands.forEach(([nome, p, l, votos, nasc, eleito], i) =>
      porLista.get(l).cands.push({i, nome, partido: D.partidos[p], lista: D.listas[l].id, votos, nasc,
                                  eleito: !!eleito}));
    out[u.uf] = {vagas: u.vagas, vv: u.vv, agrs: [...porLista.values()]};
  }
  return out;
}

// {UF: {qe, eleitos, cad, agrs, vv}} para um cenário
function simula(ano, grupos, fator = 1, limitar = false) {
  const out = {};
  for (const [uf, s] of Object.entries(ano)) {
    const {agrs, perdidos} = federar(s.agrs, grupos, fator, limitar ? s.vagas + 1 : null);
    out[uf] = {...distribuir(agrs, s.vagas, s.vv - perdidos), agrs, vv: s.vv - perdidos};
  }
  return out;
}

// Cláusula de barreira — porte de clausula.clausula. Percentuais em milésimos.
const BARREIRA = {2022: {nac: 20, uf: 10, dep: 11}, 2026: {nac: 25, uf: 15, dep: 13}}, MIN_UFS = 9;

// {id da agremiação: {votos, ufsVotos, dep, ufsDep, passa: "votos" | "deputados" | null}}
function clausula(ano, res) {
  const r = BARREIRA[ano], out = {};
  let total = 0;
  for (const u of Object.values(res)) {
    total += u.vv;
    u.agrs.forEach((a, k) => {
      const d = out[a.id] || (out[a.id] = {votos: 0, ufsVotos: 0, dep: 0, ufsDep: 0});
      d.votos += a.votos;
      if (a.votos * 1000 >= r.uf * u.vv) d.ufsVotos++;
      d.dep += u.cad[k];
      if (u.cad[k] > 0) d.ufsDep++;
    });
  }
  for (const d of Object.values(out))
    d.passa = d.votos * 1000 >= r.nac * total && d.ufsVotos >= MIN_UFS ? "votos"
      : d.dep >= r.dep && d.ufsDep >= MIN_UFS ? "deputados" : null;
  return out;
}
</script>

const linhas = [];

for (const ano of Object.keys(TESTES)) {
  const A = preparaAno(DADOS[ano]), ufs = DADOS[ano].ufs.map(u => u.uf);
  // a eleição real, direto dos dados
  const real = ufs.map(uf => A[uf].agrs.flatMap(a => a.cands).filter(c => c.eleito).map(c => c.i).sort((x, y) => x - y));
  for (const t of TESTES[ano]) {
    const res = simula(A, t.grupos, t.fator, t.limitar);
    const erradas = [];
    let trocas = 0;
    ufs.forEach((uf, k) => {
      const js = res[uf].eleitos.map(e => e.c.i).sort((x, y) => x - y);
      if (js.join() !== t.eleitos[k].join()) erradas.push(uf);
      const r = new Set(real[k]); trocas += js.filter(i => !r.has(i)).length;
    });
    if (t.nome === "real" && trocas !== 0) erradas.push("≠ eleitos oficiais");
    const barreira = clausula(ano, res), ids = new Set([...Object.keys(barreira), ...Object.keys(t.clausula)]);
    const difCl = [...ids].filter(id => (barreira[id] ? barreira[id].passa : "ausente") !== (id in t.clausula ? t.clausula[id] : "ausente"));
    if (difCl.length) erradas.push("cláusula: " + difCl.join(", "));
    const barradas = Object.values(barreira).filter(d => !d.passa).length;
    const total = ufs.reduce((s, uf) => s + res[uf].eleitos.length, 0);
    if (total !== 513) erradas.push(`${total} eleitos`);
    if (erradas.length) falhas++;
    linhas.push({ano, ...t, trocas, barradas, erradas});
  }
